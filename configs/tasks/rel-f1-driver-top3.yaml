dataset: rel-f1
task: driver-top3
task_type: classification
metric: auroc
lookback_days: 25000
ts_periods: [7, 30, 90, 365, 730, 1825, 3650]
node_policies:
  qualifying:
    feature_families: [base, semantic, conditional, temporal, sequence, episode, context]
    context_keys: [raceId, constructorId]
    annotations:
      is_top3: "{position} <= 3"
    max_columns: 6
  results:
    feature_families: [base, temporal, sequence]
    max_columns: 4
