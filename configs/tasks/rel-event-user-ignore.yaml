dataset: rel-event
task: user-ignore
task_type: classification
metric: auroc
entity_source_column: user_id
drop_columns:
  event_attendees: ["Unnamed: 0"]
  user_friends: ["Unnamed: 0"]
lookback_days: 730
ts_periods: [1, 3, 7, 14, 30, 90, 180, 365, 730]
node_policies:
  event_attendees:
    feature_families: [base, semantic, conditional, temporal, sequence, episode, context]
    context_keys: [event]
    annotations:
      is_attending: "{status} IN ('yes', 'maybe')"
      is_declined: "{status} = 'no'"
    max_columns: 6
  event_interest:
    feature_families: [base, conditional, temporal, sequence, episode, context]
    context_keys: [event]
    max_columns: 6
