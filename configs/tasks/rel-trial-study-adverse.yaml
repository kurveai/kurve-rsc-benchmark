dataset: rel-trial
task: study-adverse
task_type: regression
metric: nmae
lookback_days: 10000
ts_periods: [30, 90, 180, 365, 730, 1825, 3650]
node_policies:
  outcome_analyses:
    feature_families: [base, semantic, conditional, temporal, sequence, episode, context]
    context_keys: [nct_id, outcome_id]
    annotations:
      is_significant: "{p_value} >= 0 AND {p_value} <= 0.05"
    max_columns: 6
  reported_event_totals:
    feature_families: [base, semantic, conditional, temporal, sequence, episode, context]
    context_keys: [nct_id]
    annotations:
      is_serious_or_death: "{event_type} IN ('serious', 'deaths')"
    max_columns: 6
